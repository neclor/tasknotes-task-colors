name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)              tag="$GITHUB_REF_NAME" ;;
            release)           tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) echo "::error::unexpected event '$GITHUB_EVENT_NAME'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          manifest="$(jq -r .version manifest.json)"
          if [ "$TAG" != "$manifest" ]; then
            echo "::error::tag '$TAG' != manifest version '$manifest'"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --draft --generate-notes
          fi
          gh release upload "$TAG" main.js manifest.json styles.css --clobber
